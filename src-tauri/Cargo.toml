[package]
name = "grimalkin-1010"
version = "1.0.0"
description = "GRIMALKIN 1010 — an original two-mode arcade space shooter"
authors = ["bsommers"]
license = "Apache-2.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
